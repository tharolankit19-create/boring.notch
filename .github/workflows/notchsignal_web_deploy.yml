name: Deploy NotchSignal Web

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promote the verified preview to production
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: notchsignal-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    defaults:
      run:
        working-directory: website

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate deployment credentials
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo "::error::Missing VERCEL_TOKEN"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "::error::Missing VERCEL_ORG_ID"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "::error::Missing VERCEL_PROJECT_ID"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Pull production environment
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build exactly what will be deployed
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Create isolated deployment
        id: deploy
        run: |
          set -euo pipefail
          URL="$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $URL"

      - name: Smoke landing and server
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if curl --fail --silent --show-error "$DEPLOY_URL/" -o /tmp/home.html; then
              break
            fi
            sleep 2
          done

          test -s /tmp/home.html
          grep -q "Stop checking" /tmp/home.html
          grep -q "NotchSignal" /tmp/home.html
          curl --fail --silent --show-error "$DEPLOY_URL/download" -o /tmp/download.html
          grep -q "NotchSignal" /tmp/download.html

      - name: Require downloadable signed release before production
        if: ${{ inputs.promote }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error "$DEPLOY_URL/api/ready" -o /tmp/ready.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/ready.json'))
          if data.get('ready') is not True:
              raise SystemExit(f"NotchSignal is not commerce-ready: {data}")
          print("Release gate is ready:", data)
          PY

      - name: Promote verified deployment to production
        if: ${{ inputs.promote }}
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx --yes vercel@latest promote "$DEPLOY_URL" --yes --token="$VERCEL_TOKEN"

      - name: Deployment summary
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### NotchSignal web deployment"
            echo
            echo "- Verified deployment: $DEPLOY_URL"
            echo "- Production promotion requested: ${{ inputs.promote }}"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
